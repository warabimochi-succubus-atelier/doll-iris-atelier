name: Build resvg

# Builds resvg's C API (resvg.dll, win-x64) from a fixed upstream tag.
# The app rasterizes its SVG with it; the DLL is committed under third_party/resvg (see its README.md).
# Run it by hand, download the "resvg-win-x64" artifact and replace the files in third_party/resvg/win-x64.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: resvg tag (https://github.com/linebender/resvg/releases)
        default: v0.49.0
        required: true
  # Also runs when this file or the license settings change on a branch, so a new version can be built before it is on main.
  # Branches only: GitHub does not check `paths` for tag pushes, so without `branches` every release tag ran this build.
  push:
    branches: ['**']
    paths:
      - .github/workflows/build-resvg.yml
      - third_party/resvg/about/**

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || 'v0.49.0' }}
      # No dependency on the Visual C++ runtime DLLs
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Check out resvg
        run: git clone --depth 1 --branch "$env:TAG" https://github.com/linebender/resvg.git resvg

      # Text, fonts and SVGZ are not used (labels are drawn by WPF); raster-images keeps embedded PNGs (nebula)
      - name: Build
        working-directory: resvg
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --release --locked -p resvg-capi --no-default-features --features raster-images

      # about.toml / about.hbs for the license file live in this repository
      - uses: actions/checkout@v7
        with:
          path: app
          sparse-checkout: third_party/resvg/about

      # Full license texts (with each crate's copyright lines) of everything linked into the DLL.
      # Prebuilt cargo-about, checked against its published SHA-256.
      - name: Third-party licenses
        env:
          ABOUT_VERSION: 0.9.2
        run: |
          $name = "cargo-about-$env:ABOUT_VERSION-x86_64-pc-windows-msvc.tar.gz"
          $base = "https://github.com/EmbarkStudios/cargo-about/releases/download/$env:ABOUT_VERSION"
          Invoke-WebRequest "$base/$name" -OutFile $name
          Invoke-WebRequest "$base/$name.sha256" -OutFile "$name.sha256"
          $expected = ((Get-Content "$name.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "cargo-about checksum mismatch: $actual (expected $expected)" }
          New-Item -ItemType Directory -Force tools | Out-Null
          tar -xzf $name -C tools
          $about = (Get-ChildItem tools -Recurse -Filter cargo-about.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force out | Out-Null
          & $about generate --manifest-path resvg/crates/c-api/Cargo.toml --no-default-features --features raster-images `
            --locked --fail -c app/third_party/resvg/about/about.toml -o out/THIRD-PARTY-LICENSES.txt app/third_party/resvg/about/about.hbs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content out/THIRD-PARTY-LICENSES.txt -TotalCount 40

      - name: Collect
        run: |
          $out = "out/win-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item resvg/target/release/resvg.dll $out
          Copy-Item resvg/LICENSE-APACHE, resvg/LICENSE-MIT out
          # Crates linked into the DLL with their licenses (for NOTICE.md)
          cargo +stable tree --manifest-path resvg/Cargo.toml -p resvg-capi --no-default-features --features raster-images -e normal --prefix none --format "{p} | {l}" | Sort-Object -Unique | Set-Content -Encoding utf8 out/DEPENDENCIES.txt
          $commit = git -C resvg rev-parse HEAD
          $hash = (Get-FileHash "$out/resvg.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $rustc = rustc +stable --version
          "tag: $env:TAG`ncommit: $commit`nsha256 (win-x64/resvg.dll): $hash`nfeatures: raster-images (no text / system-fonts / svgz), crt-static`nrustc: $rustc" | Set-Content -Encoding utf8 out/VERSION.txt
          Get-Content out/VERSION.txt
          Get-ChildItem -Recurse out | Format-Table FullName, Length

      - uses: actions/upload-artifact@v7
        with:
          name: resvg-win-x64
          path: out/
          if-no-files-found: error
