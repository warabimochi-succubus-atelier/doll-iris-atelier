name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request replaces the run in progress, so it doesn't use extra minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest # WPF only builds on Windows
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Building the test project also builds the app it references
      - name: Restore
        run: dotnet restore DollIrisGenerator.Tests

      - name: Build
        run: dotnet build DollIrisGenerator.Tests --configuration Release --no-restore

      - name: Test
        run: dotnet test DollIrisGenerator.Tests --configuration Release --no-build
