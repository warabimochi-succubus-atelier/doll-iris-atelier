version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # NuGet packages (there is no .sln, so list the projects that have PackageReference)
  - package-ecosystem: nuget
    directories:
      - /DollIrisGenerator.Tests
      - /DollIrisGenerator.Web
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # A major version follows the .NET version (e.g. Blazor 11 needs .NET 11): update those by hand
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
